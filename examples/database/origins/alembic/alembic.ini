# Alembic migrations of the acme core schema: the same five steps as flyway/, with step 3 split into
# two branches (customer details, product cost) joined again by a merge revision.
# The database comes from the ACME_DATABASE_URL environment variable (see env.py).
[alembic]
script_location = %(here)s
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(message)s
