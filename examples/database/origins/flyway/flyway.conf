# Where these migrations go: the test bed's PostgreSQL (port POSTGRES_PORT of ../../.env, 55432 by
# default). doctracker reads this file to link the origin to the database it describes; Flyway itself is
# run by ../compare_origins.py, which gives its container the same database.
flyway.url=jdbc:postgresql://localhost:55432/origin_flyway
flyway.locations=filesystem:.
