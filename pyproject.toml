[project]
name = "doctracker"
version = "0.3.1"
description = "MCP server that centralizes the documentation of Python projects developed with LLM agents."
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
    "src/doctracker/wiki/static/htmx-LICENSE.txt",
    "src/doctracker/wiki/static/cola-LICENSE.txt",
    "src/doctracker/wiki/static/dagre-LICENSE.txt",
    "src/doctracker/wiki/static/icons/tabler-icons-LICENSE.txt",
]
authors = [
    { name = "Carlos Filipe de Castro Lemos", email = "carlos.lemos.dev@gmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "click>=8.5.0",
    "cryptography>=50.0.2",
    "griffe>=2.4.1",
    "httpx2>=2.16.0",
    "jinja2>=3.1.6",
    "keyring>=25",
    "markdown-it-py>=4.2.0",
    "mcp>=2.3.0,<3",
    "numpy>=2.4.6",
    "paramiko>=4",
    "pg8000>=1.31.6",
    "pygments>=2.21.0",
    "pymysql>=1.2.3",
    "python-tds>=1.17.1",
    "sqlalchemy>=2.1.6",
    "sqlalchemy-pytds>=1.0.3",
    "sqlglot>=30.26.0",
    "sqlite-vec>=0.1.9",
    "starlette>=1.10.0",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=1.22.1",
    "uvicorn>=0.54.0",
    "vulture>=2.14",
]

[project.urls]
Homepage = "https://github.com/cfclemos/doctracker"
Repository = "https://github.com/cfclemos/doctracker"
Issues = "https://github.com/cfclemos/doctracker/issues"

[project.scripts]
doctracker = "doctracker.cli:main"

[project.optional-dependencies]
oracle = [
    "oracledb>=3",
]
aws = [
    "boto3>=1.40",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
